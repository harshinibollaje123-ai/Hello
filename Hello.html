<!DOCTYPE html>
<html>
<head>
    <title>My First Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1f2937;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background-color: #1f2937;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        .content {
            text-align: center;
            padding: 70px;
            background-color: white;
        }

        h1 {
            color: #1f2937;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: white;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        footer {
            background-color: #1f2937;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Welcome to my website</h2>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h1>Hello World!</h1>

        <p>
            This is my first webpage created using HTML and CSS.
        </p>

        <button onclick="alert('Hello!')">
            Click Me
        </button>
    </div>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
